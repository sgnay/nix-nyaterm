name: Update NyaTerm

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs: these jobs hold
# `id-token: write` for the Magic Nix Cache OIDC login, so a retagged or
# compromised release could otherwise execute code with that token. Bump the
# SHA and its trailing version comment together.

# Baseline for any job below that does not declare its own block. A job-level
# `permissions` key replaces this outright rather than merging with it, and an
# unspecified scope becomes `none`.
permissions:
  contents: read

concurrency:
  group: update-nyaterm
  cancel-in-progress: false

env:
  # Fixed name so a re-run updates the existing PR instead of opening duplicates.
  UPDATE_BRANCH: chore/update-nyaterm

jobs:
  update:
    name: Bump pinned NyaTerm release
    runs-on: ubuntu-latest
    # Same budget as nix.yml: these jobs build the package from source, which takes
    # 85-95 minutes on a 4 vCPU runner, so a tighter cap turns a slow build into an
    # apparent cancellation.
    timeout-minutes: 150
    permissions:
      contents: write # pushes the update branch
      id-token: write # Magic Nix Cache OIDC login
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      # The updater builds the package itself. A single `nyaterm-desktop` rustc
      # peaks above 10 GiB, so the package build is serialized here instead of
      # sharing the runner's memory with a second rustc unit.
      NIX_CONFIG: cores = 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      # actions/checkout configures credentials but no commit identity, and
      # --commit runs `git commit`, so this has to be set explicitly.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record base revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      # Bumps the release tag, refreshes the lock file and adopts any fixed-output
      # hash Nix reports. Exits non-zero on a real build break so no PR is opened.
      - name: Update pinned upstream release
        run: ./scripts/update-upstream.sh --commit

      - name: Publish update branch
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.base.outputs.sha }}" ]; then
            echo "The pin is already current; nothing to open."
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$UPDATE_BRANCH"
          # Force so a re-run on an existing branch succeeds rather than failing
          # on a non-fast-forward push.
          git push --force -u origin "$UPDATE_BRANCH"
          echo "pushed=true" >>"$GITHUB_OUTPUT"

  # While the pin is a commit that no release tag contains, the `update` job
  # exits before it builds anything, so nothing downstream runs. Without this job
  # an unreachable revision would only be noticed on the next push.
  #
  # It builds the pin of the ref that triggered the run: a schedule always starts
  # on the default branch, while `workflow_dispatch` starts on the ref it was
  # invoked from.
  #
  # It stays separate from `verify`, which must be gated on `pushed` so it checks
  # out the update branch.
  verify-pin:
    name: Build committed pin (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Same budget as nix.yml: these jobs build the package from source, which takes
    # 85-95 minutes on a 4 vCPU runner, so a tighter cap turns a slow build into an
    # apparent cancellation.
    timeout-minutes: 150
    permissions:
      contents: read # checkout and build only
      id-token: write # Magic Nix Cache OIDC login
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fetch the locked revision directly from GitHub before Nix or any binary
      # cache is configured, so a cached source/output cannot mask its deletion.
      - name: Verify locked source revision is reachable
        shell: bash
        run: |
          owner=$(jq -r '.nodes["nyaterm-src"].locked.owner' flake.lock)
          repo=$(jq -r '.nodes["nyaterm-src"].locked.repo' flake.lock)
          rev=$(jq -r '.nodes["nyaterm-src"].locked.rev' flake.lock)
          [[ "$owner" =~ ^[A-Za-z0-9_.-]+$ && "$repo" =~ ^[A-Za-z0-9_.-]+$ && "$rev" =~ ^[0-9a-f]{40}$ ]]
          tmp=$(mktemp -d "$RUNNER_TEMP/nyaterm-pin.XXXXXX")
          git init --quiet "$tmp"
          git -C "$tmp" fetch --no-tags --depth=1 "https://github.com/${owner}/${repo}.git" "$rev"
          fetched=$(git -C "$tmp" rev-parse FETCH_HEAD)
          test "$fetched" = "$rev"

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      # The output check pulls in the package, so this is the same build users
      # install. It is a cache hit unless the pin moved. `--no-update-lock-file`
      # is what makes this step mean what it says: without it Nix would re-lock a
      # `flake.nix` pin that `flake.lock` does not match, build a revision the
      # reachability step above never fetched, and leave the checkout dirty.
      - name: Build and verify package outputs
        run: nix build .#checks.${{ matrix.target }}.nyaterm --cores 1 --no-update-lock-file -L

  verify:
    name: Build Linux (${{ matrix.target }})
    needs: update
    if: needs.update.outputs.pushed == 'true'
    runs-on: ${{ matrix.os }}
    # Same budget as nix.yml: these jobs build the package from source, which takes
    # 85-95 minutes on a 4 vCPU runner, so a tighter cap turns a slow build into an
    # apparent cancellation.
    timeout-minutes: 150
    permissions:
      contents: read # checkout and build only; never pushes
      id-token: write # Magic Nix Cache OIDC login
    strategy:
      fail-fast: false
      # Both runners are 4 vCPU / 16 GiB, and a single `nyaterm-desktop` rustc
      # peaks above 10 GiB, so two concurrent rustc units can exceed the runner's
      # memory. The package build is therefore serialized; the output check that
      # follows replays the already-built package and keeps 2.
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout update branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.UPDATE_BRANCH }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      # Built here because a PR opened with GITHUB_TOKEN does not trigger the
      # pull_request branch of nix.yml, so that matrix never runs for it. The
      # script refreshed flake.lock before pushing, so a stale lock fails here
      # rather than being re-resolved under the PR.
      - name: Build NyaTerm package
        run: nix build .#nyaterm --cores 1 --no-update-lock-file -L

      - name: Verify package outputs
        run: nix build .#checks.${{ matrix.target }}.nyaterm --cores 2 --no-update-lock-file -L

  open-pr:
    name: Open pull request
    needs: [update, verify]
    # verify is skipped when nothing was pushed, so only gate on `update` here.
    if: needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `gh pr create --head` skips pushing entirely, so no write access to
    # contents is needed here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout update branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.UPDATE_BRANCH }}
          persist-credentials: false

      - name: Create or refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head "$UPDATE_BRANCH" --state open \
            --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open on this branch; it now carries the latest bump."
            exit 0
          fi
          gh pr create \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --head "$UPDATE_BRANCH" \
            --title "chore(nix): update NyaTerm" \
            --body "$(cat <<'BODY'
          Automated bump of the pinned NyaTerm upstream release.

          Opened by `scripts/update-upstream.sh`, which advanced the release tag,
          refreshed `flake.lock`, adopted the fixed-output hashes Nix reported, and
          built successfully. Both Linux architectures were built and verified before
          this PR was opened.

          Note: this PR was opened with the default `GITHUB_TOKEN`, which does not
          trigger `pull_request` workflows, so the `nix.yml` matrix does not run on
          it. The equivalent matrix runs in the `Update NyaTerm` workflow instead,
          and `nix.yml` will run normally once a human pushes to this branch.

          Review `flake.nix`, `flake.lock` and `nix/package.nix`. The updater stays
          within the pinned major line; check the upstream source layout and package
          version for compatibility.
          BODY
          )"
